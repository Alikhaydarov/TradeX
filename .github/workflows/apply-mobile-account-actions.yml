name: Apply mobile account actions

on:
  push:
    branches:
      - agent/mobile-account-actions-sheet
    paths:
      - "tools/apply-mobile-account-actions.mjs"
      - ".github/workflows/apply-mobile-account-actions.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-account-actions-sheet
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply responsive mobile account sheet
        run: node tools/apply-mobile-account-actions.mjs
      - name: Install dependencies
        run: npm ci
      - name: Tailwind ownership guard
        run: npm run check:ui-parity
      - name: Responsive audit
        run: npm run audit:responsive
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated fix
        run: |
          rm tools/apply-mobile-account-actions.mjs
          rm .github/workflows/apply-mobile-account-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sidebar.tsx tools/apply-mobile-account-actions.mjs .github/workflows/apply-mobile-account-actions.yml
          git commit -m "fix: add responsive mobile account action sheet"
          git push origin HEAD:agent/mobile-account-actions-sheet
