name: UI quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tailwind UI audit
        run: npm run audit:ui

      - name: ESLint and capture report
        id: eslint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee eslint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint.log
          retention-days: 3

      - name: Fail on ESLint errors
        if: steps.eslint.outputs.status != '0'
        run: exit 1

      - name: Production build
        run: npm run build

      - name: Lighthouse desktop audit
        run: npx --yes @lhci/cli@0.15.1 autorun
