name: Apply responsive core fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-responsive-core-fixes.mjs"
      - ".github/workflows/apply-responsive-core-fixes.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-performance-audit-1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply responsive fixes
        run: node tools/apply-responsive-core-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Tailwind ownership guard
        run: npm run check:ui-parity
      - name: Responsive audit
        run: node tools/audit-responsive-ui.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: improve core mobile responsiveness"
          git push origin HEAD:agent/ui-performance-audit-1
