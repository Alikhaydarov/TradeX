name: Journal completion PR

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/journal-completion-request.md"
      - "tools/apply-journal-completion.mjs"
      - "src/components/journal-v2.tsx"
      - "src/components/journal/**"
      - ".github/workflows/journal-completion-pr.yml"

permissions:
  contents: write

concurrency:
  group: journal-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect pending migration
        id: pending
        shell: bash
        run: |
          if [ -f tools/apply-journal-completion.mjs ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.pending.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Journal modularization
        if: steps.pending.outputs.enabled == 'true'
        run: node tools/apply-journal-completion.mjs

      - name: Install dependencies
        if: steps.pending.outputs.enabled == 'true'
        run: npm ci

      - name: Verify Tailwind ownership
        if: steps.pending.outputs.enabled == 'true'
        run: npm run check:ui-parity

      - name: Lint
        if: steps.pending.outputs.enabled == 'true'
        run: npm run lint

      - name: Production build
        if: steps.pending.outputs.enabled == 'true'
        run: npm run build

      - name: Commit validated migration to PR branch
        if: steps.pending.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete Journal module architecture"
          git push origin HEAD:${{ github.head_ref }}
