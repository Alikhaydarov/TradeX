name: Apply workspace route group

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply-workspace-route-group.mjs"
      - ".github/workflows/apply-workspace-route-group.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply route-group migration
        run: node tools/apply-workspace-route-group.mjs

      - name: Commit route-group architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: move workspace pages into App Router route group"
          git push origin HEAD:main
