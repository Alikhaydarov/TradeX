name: Apply journal completion

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply-journal-completion.mjs"
      - ".github/workflows/apply-journal-completion.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Journal modularization
        run: node tools/apply-journal-completion.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tailwind ownership guard
        run: npm run check:ui-parity

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated Journal modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: complete Journal module architecture"
          git push origin HEAD:main
