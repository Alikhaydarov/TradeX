name: Apply journal completion

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply-journal-completion.mjs"
      - ".github/workflows/apply-journal-completion.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply, validate and commit Journal architecture
        shell: bash
        run: |
          set +e
          log=/tmp/journal-completion.log
          : > "$log"

          echo "== Apply codemod ==" >> "$log"
          node tools/apply-journal-completion.mjs >> "$log" 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            echo "== npm ci ==" >> "$log"
            npm ci >> "$log" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo "== Tailwind ownership ==" >> "$log"
            npm run check:ui-parity >> "$log" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo "== ESLint ==" >> "$log"
            npm run lint >> "$log" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo "== Production build ==" >> "$log"
            npm run build >> "$log" 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp "$log" /tmp/journal-completion-saved.log
            git reset --hard HEAD
            mkdir -p docs
            cp /tmp/journal-completion-saved.log docs/journal-completion-diagnostics.log
            git add docs/journal-completion-diagnostics.log
            git commit -m "ci: record Journal completion failure"
            git push origin HEAD:main
            tail -n 200 /tmp/journal-completion-saved.log
            exit "$status"
          fi

          rm -f docs/journal-completion-diagnostics.log
          git add -A
          git commit -m "refactor: complete Journal module architecture"
          git push origin HEAD:main
