name: Apply journal trade editor split

on:
  push:
    branches:
      - agent/app-router-ui-parity-v2
    paths:
      - "tools/apply-journal-trade-editor-split.mjs"
      - ".github/workflows/apply-journal-trade-editor-split.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-router-ui-parity-v2
          fetch-depth: 0

      - name: Extract trade editor module
        run: node tools/apply-journal-trade-editor-split.mjs

      - name: Commit extracted trade editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: extract journal trade editor module"
          git push origin HEAD:agent/app-router-ui-parity-v2
