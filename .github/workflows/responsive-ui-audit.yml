name: Responsive UI audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/audit-responsive-ui.mjs"
      - ".github/workflows/responsive-ui-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Responsive static audit
        run: node tools/audit-responsive-ui.mjs
      - name: Tailwind ownership guard
        run: npm run check:ui-parity
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload responsive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-audit
          path: responsive-ui-audit.json
          if-no-files-found: error
