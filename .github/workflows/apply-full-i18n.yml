name: Apply full i18n

on:
  push:
    branches:
      - agent/full-i18n-en-uz-ru-ko
    paths:
      - "tools/apply-full-i18n.mjs"
      - ".github/workflows/apply-full-i18n.yml"
      - ".i18n-payload/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-i18n-en-uz-ru-ko
          fetch-depth: 0

      - name: Install full locale architecture
        run: node tools/apply-full-i18n.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Tailwind-only UI ownership
        run: npm run check:ui-parity

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated i18n architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: install complete EN UZ RU KO i18n architecture"
          git push origin HEAD:agent/full-i18n-en-uz-ru-ko
