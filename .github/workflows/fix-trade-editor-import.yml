name: Fix trade editor import

on:
  push:
    branches:
      - agent/app-router-ui-parity-v2
    paths:
      - "tools/fix-trade-editor-import.mjs"
      - ".github/workflows/fix-trade-editor-import.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-router-ui-parity-v2
          fetch-depth: 0

      - name: Fix trade editor import
        run: node tools/fix-trade-editor-import.mjs

      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: add extracted trade editor effect import"
          git push origin HEAD:agent/app-router-ui-parity-v2
