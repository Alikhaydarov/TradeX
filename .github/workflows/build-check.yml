name: Build check

on:
  push:
    branches:
      - agent/app-router-ui-parity-v2
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify UI parity scope
        run: npm run check:ui-parity
      - name: Lint
        run: npm run lint
      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 build.log
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: build.log
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
