name: Build check

on:
  push:
    branches:
      - main
      - agent/app-router-ui-parity-v2
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  journal-completion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect pending Journal migration
        id: pending
        shell: bash
        run: |
          if [ -f tools/apply-journal-completion.mjs ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.pending.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Journal modularization
        if: steps.pending.outputs.enabled == 'true'
        run: node tools/apply-journal-completion.mjs

      - name: Install dependencies
        if: steps.pending.outputs.enabled == 'true'
        run: npm ci

      - name: Verify Tailwind ownership
        if: steps.pending.outputs.enabled == 'true'
        run: npm run check:ui-parity

      - name: Lint migrated source
        if: steps.pending.outputs.enabled == 'true'
        run: npm run lint

      - name: Build migrated source
        if: steps.pending.outputs.enabled == 'true'
        run: npm run build

      - name: Commit validated Journal architecture
        if: steps.pending.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: complete Journal module architecture"
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload refactor sources
        uses: actions/upload-artifact@v4
        with:
          name: refactor-main-source
          path: |
            src/components/feed-v3.tsx
            src/components/feed
            src/components/journal-v2.tsx
            src/components/journal
            src/components/sidebar.tsx
            src/components/workspace-app-router-shell-v2.tsx
            src/app/(workspace)
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify UI parity scope
        run: npm run check:ui-parity
      - name: Lint
        run: npm run lint
      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 build.log
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: build.log
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
      # Greps catch shapes; this catches what a browser actually paints -
      # unreadable text, targets too small to hit, a page that scrolls sideways.
      - name: Install chromium for the rendered audit
        run: npx playwright install --with-deps chromium
      - name: Rendered UI audit
        run: npm run audit:rendered
