name: Apply sidebar Sheet

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply-sidebar-sheet.mjs"
      - ".github/workflows/apply-sidebar-sheet.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply sidebar migration
        run: node tools/apply-sidebar-sheet.mjs
      - name: Commit sidebar migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: use Sheet and prefetched links in sidebar"
          git push origin HEAD:main
