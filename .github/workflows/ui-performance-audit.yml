name: UI performance audit

on:
  push:
    branches:
      - agent/ui-performance-audit-1
    paths:
      - "src/**"
      - "tools/audit-ui-performance.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-performance-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/audit-ui-performance.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-performance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit source and dependencies
        run: node tools/audit-ui-performance.mjs
      - name: Tailwind ownership guard
        run: npm run check:ui-parity
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-performance-audit
          path: ui-performance-audit.json
          if-no-files-found: error
