name: Fix journal editor boundary

on:
  push:
    branches:
      - agent/app-router-ui-parity-v2
    paths:
      - "tools/fix-journal-editor-boundary.mjs"
      - ".github/workflows/fix-journal-editor-boundary.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-router-ui-parity-v2
          fetch-depth: 0

      - name: Repair extraction boundary
        run: node tools/fix-journal-editor-boundary.mjs

      - name: Commit repaired boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore journal workspace closing markup"
          git push origin HEAD:agent/app-router-ui-parity-v2
