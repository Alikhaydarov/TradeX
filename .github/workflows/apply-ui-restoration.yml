name: Apply UI restoration codemod

on:
  push:
    branches:
      - audit-all-ui-tailwind
    paths:
      - tools/apply-ui-restoration.mjs
      - .github/workflows/apply-ui-restoration.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-all-ui-tailwind
          fetch-depth: 0

      - name: Apply deterministic UI restoration
        run: node tools/apply-ui-restoration.mjs

      - name: Commit restored UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git commit -m "Complete Tailwind UI restoration"
          git push origin HEAD:audit-all-ui-tailwind
