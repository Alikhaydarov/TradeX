name: Apply final lint cleanup

on:
  push:
    branches:
      - agent/app-router-ui-parity-v2
    paths:
      - "tools/apply-final-lint-cleanup.mjs"
      - ".github/workflows/apply-final-lint-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-router-ui-parity-v2
          fetch-depth: 0

      - name: Apply final lint cleanup
        run: node tools/apply-final-lint-cleanup.mjs

      - name: Commit final lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: complete App Router lint cleanup"
          git push origin HEAD:agent/app-router-ui-parity-v2
