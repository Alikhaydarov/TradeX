name: Fix spinner and post views

on:
  push:
    branches:
      - fix/spinner-and-post-views
    paths:
      - "tools/fix-spinner-and-post-views.mjs"
      - ".github/workflows/fix-spinner-and-post-views.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/spinner-and-post-views
          fetch-depth: 0

      - name: Apply App Router repair
        run: node tools/fix-spinner-and-post-views.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Tailwind-only ownership
        run: npm run check:ui-parity

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep one loader and restore post view tracking"
          git push origin HEAD:fix/spinner-and-post-views
