name: Fix final plan blockers

on:
  push:
    branches:
      - agent/final-plan-completion
    paths:
      - "tools/fix-final-plan-blockers.mjs"
      - ".github/workflows/fix-final-plan-blockers.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-plan-completion
          fetch-depth: 0
      - name: Apply blocker fixes
        run: node tools/fix-final-plan-blockers.mjs
      - name: Commit blocker fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: resolve feed and Journal validation blockers"
          git push origin HEAD:agent/final-plan-completion
