name: I18n migration

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".i18n-payload/**"
      - "tools/apply-full-i18n.mjs"
      - "tools/audit-i18n.mjs"
      - ".github/workflows/i18n-audit.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-i18n-en-uz-ru-ko
          fetch-depth: 0

      - name: Install locale architecture
        id: install
        shell: bash
        run: |
          set +e
          if [ -f tools/apply-full-i18n.mjs ]; then
            node tools/apply-full-i18n.mjs > i18n-install.log 2>&1
            status=$?
          else
            echo "Installer already applied." > i18n-install.log
            status=0
          fi
          cat i18n-install.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-install-log
          path: i18n-install.log
          if-no-files-found: error

      - name: Fail when installer failed
        if: steps.install.outputs.status != '0'
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Tailwind-only ownership
        run: npm run check:ui-parity

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated locale architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: install complete EN UZ RU KO i18n architecture"
          git push origin HEAD:agent/full-i18n-en-uz-ru-ko
