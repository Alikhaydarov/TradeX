name: I18n audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/audit-i18n.mjs"
      - "tools/check-i18n-coverage.mjs"
      - ".github/workflows/i18n-audit.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify localization coverage
        run: npm run check:i18n
      - name: Upload i18n audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit
          path: i18n-audit.json
          if-no-files-found: warn
