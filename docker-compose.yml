services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradoxy
      POSTGRES_USER: tradoxy
      POSTGRES_PASSWORD: tradoxy
    ports:
      - "5432:5432"
    volumes:
      - tradoxy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradoxy"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - tradoxy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tradoxy_postgres:
  tradoxy_redis:

